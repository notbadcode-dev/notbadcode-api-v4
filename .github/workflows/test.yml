name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-script: [test:auth, test:common]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.test-script }}
        run: npm run ${{ matrix.test-script }}

      - name: Upload test results (JUnit)
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.test-script }}
          path: reports/junit/results.xml

      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Jest Tests (${{ matrix.test-script }})
          path: reports/junit/results.xml
          reporter: jest-junit
